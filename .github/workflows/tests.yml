# Corre los tests en cada push y PR a main y, si pasan, publica en produccion.
# - unit: npm test (logica de alertas, SSR, requisitos, etc.)
# - firestore-rules: aislamiento multi-tenant contra el emulador de Firestore
# - deploy: solo en push a main (o corrida manual sobre main) y solo si los
#   dos jobs de tests pasaron. Publica traveldocs.com.ar con el mismo
#   `netlify deploy --prod` del deploy manual.
#
# Secrets del repo que usa el deploy:
# - NETLIFY_AUTH_TOKEN: token de Netlify con acceso al sitio
# - NETLIFY_SITE_ID: id del sitio tradingdocs-staging
# El resto (SENTRY_AUTH_TOKEN, keys de IA, etc.) vive en las env vars del
# sitio en Netlify y el CLI las inyecta en el build.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Si hay dos pushes seguidos, cancela los tests viejos.
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Carga la entrada real del paquete NFT, ademas del renderer interno.
      - run: npm install --global netlify-cli@27.12.1
      - run: node scripts/bundle-functions.mjs
      - run: node tests/facturacion/billing-package.smoke.mjs "$(npm root --global)/netlify-cli"

  firestore-rules:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rules-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # El emulador de Firestore es un .jar: necesita Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Evita bajar el .jar del emulador en cada corrida.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run test:rules:emulator

      - run: npm run test:billing:emulator

  mfa-ui:
    name: MFA y flujos funcionales en navegador (servicios simulados)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mfa-ui-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run build:frontend
      - run: node tests/mfa-ui.smoke.mjs
        env:
          PUBLIC_DIR: ${{ github.workspace }}/.netlify/site
      - run: curl --fail --retry 3 https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js --output /tmp/agency-xlsx.min.js
      - run: node tests/agency-ui.smoke.mjs
        env:
          XLSX_QA_PATH: /tmp/agency-xlsx.min.js
          PUBLIC_DIR: ${{ github.workspace }}/.netlify/site

      - run: npm run test:billing:ui
        env:
          PUBLIC_DIR: ${{ github.workspace }}/.netlify/site

  deploy:
    name: Deploy a produccion (Netlify)
    needs: [unit, firestore-rules, mfa-ui]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un deploy a la vez y nunca se corta a la mitad: si llega otro push,
    # espera a que termine el que esta en curso.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # scripts/bundle-functions.mjs usa COMMIT_REF como release de Sentry.
      COMMIT_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Incluye esbuild y el plugin de Sentry que usa el build de produccion.
      - run: npm ci

      # Corre el build de [context.production] (bundle-functions.mjs) y publica.
      - run: npx --yes netlify-cli@27.12.1 deploy --prod --message "GitHub Actions ${{ github.sha }}"
